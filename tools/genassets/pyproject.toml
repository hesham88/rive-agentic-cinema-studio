[project]
name = "genassets"
version = "0.1.0"
description = "Generative asset pipeline: Gemini -> normalize -> vectorize -> Rive"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "numpy>=1.26", "vtracer>=0.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
