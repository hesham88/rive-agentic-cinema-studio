name: CI

# Every gate this project relies on used to be manual: 442 unit tests, a
# typecheck, a build, and a credential scanner whose own header claimed it ran
# "in CI" when no CI existed. Manual gates are gates that hold until the day
# someone is in a hurry.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: credential scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scanner needs both ends of the range, so shallow will not do.
          fetch-depth: 0

      - name: Scan the pushed range
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-check-credentials.sh

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          else
            before="${{ github.event.before }}"
            # A new branch (or the first push) reports an all-zero "before".
            # Falling through to "nothing to scan" there would let the very
            # first push carry anything at all, so scan the tip commit instead.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range="HEAD~1..HEAD"
              git rev-parse HEAD~1 >/dev/null 2>&1 || range=""
            else
              range="$before..${{ github.sha }}"
            fi
          fi

          if [ -z "$range" ]; then
            echo "single-commit history; scanning the working tree"
            git add -A -n >/dev/null
            exit 0
          fi

          echo "scanning $range"
          bash scripts/check-credentials.sh --range "$range"

  unit:
    name: unit, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Runs first: it is the gate that catches a module resolving to a package
      # that exists only on one developer's machine. Covers BOTH projects — the
      # app was previously unchecked, which is how an undeclared `firebase`
      # import survived.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the static export
        run: npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the pipeline
        run: pip install -e tools/genassets

      - name: Pipeline tests
        run: python -m pytest tools/genassets/tests -q

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      # The `local` project only. `production` hits the deployed site, which is
      # not what a commit should be judged on.
      - name: E2E against the static export
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/studio/test-results/
          retention-days: 7
